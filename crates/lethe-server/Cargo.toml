[package]
name = "lethe-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "lethe-server"
path = "src/main.rs"

[dependencies]
lethe-types = { path = "../lethe-types" }

axum = { version = "0.7", features = ["macros"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "limit", "fs"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "time", "macros", "migrate"] }

askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

ed25519-dalek = "2"
# Ring-signature verification for room vouches (crypto.rs only). The
# `digest` feature provides `nonspec_map_to_curve`, which is
# byte-compatible with libsodium's `crypto_core_ed25519_from_uniform`
# over the first 32 bytes of a SHA-512 digest — the browser side.
curve25519-dalek = { version = "4", features = ["digest", "precomputed-tables"] }
sha2 = "0.10"
rand = "0.8"

time = { workspace = true }

base64 = "0.22"

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"

# Profanity / hate-speech detector. Pure Rust, no model files, MIT.
# Used by moderation::rules to auto-delete severe slurs and severe
# harassment. Mild profanity is intentionally allowed through.
rustrict = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dryoc = "0.7"
chacha20poly1305 = "0.10"
