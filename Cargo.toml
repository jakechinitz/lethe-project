[workspace]
resolver = "2"
members = [
    "crates/lethe-cli",
    "crates/lethe-server",
    "crates/lethe-types",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["serde", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
